<!DOCTYPE html>
<html lang="ja">

  <link rel="stylesheet" href="style.css">
  <!--  フォント -->

<body id="top">

    <div class="logo">
      <a href="#top">75cmの世界</a>
    </div>
    <nav class="nav">
      <a href="#about">about</a>
      <a href="#gallery">gallery</a>
    </nav>
  </header>

  <main>
    <!-- メインビジュアル -->
    <section class="hero-section">
      <div class="hero-content">
        <h1>75cmの世界</h1>
      </div>
    </section>

    <!-- About セクション -->
    <section id="about" class="about-section">
      <div class="container about-container">
        <div class="about-image">
          <img src="images/about.jpg" alt="夕焼け空">
        </div>
        <div class="about-text">
          <h2>about</h2>
          <p>赤ちゃんの視点である75cmの高さから日常を撮影し、大人が忘れた小さな世界の見え方を再発見するためのサイト</p>
        </div>
      </div>
    </section>

        <h2 class="section-title">gallery</h2>
        <div class="gallery-grid">
          
          <!-- 写真アイテム 1 -->
          <div class="gallery-item"

               data-image="images/image01.jpg"
               data-desc="大人は見ない遊具の中">
           <div class="image-wrapper">
             <img src="images/image01.jpg" alt="写真01">

              <img src="images/image03.jpg" alt="写真03">

  <!-- モーダル（Lightbox & 写真詳細機能） -->

    <span class="modal-close">&times;</span>
    <div class="modal-content">
      <h3 id="modal-title" class="modal-title"></h3>
      <div class="modal-image-wrapper">
